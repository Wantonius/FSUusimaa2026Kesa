<table class="table table-striped">
	<thead>
		<tr>
			<th>Type</th>
			<th>Count</th>
			<th>Price</th>
			<th>Remove</th>
		</tr>	
	</thead>
	<tbody>
		<tr *ngFor="let item of list()">
			<td>{{item.type}}</td>
			<td>{{item.count}}</td>
			<td>{{item.price}}</td>
			<td><button (click)="removeItem(item.id)" class="btn btn-danger">Remove</button></td>
		</tr>
	</tbody>
</table>
